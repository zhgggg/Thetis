name: Build Thetis (zh-CN)

on:
  push:
    tags:
      - 'v*-zh*'
  workflow_dispatch:

permissions:
  contents: write

env:
  THETIS_VERSION: "2.10.3.16"

jobs:
  build:
    name: Build x64
    runs-on: windows-2025
    env:
      arch: x64
      thetis_platform: x64
      native_platform: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "Project Files\Source\Thetis_VS2026.sln" -PackagesDirectory "Project Files\Source\packages"

      - name: Build cmASIO (native)
        shell: pwsh
        run: msbuild "Project Files\Source\cmASIO\cmASIO.vcxproj" /p:Configuration=Release /p:Platform=${{ env.native_platform }} /p:SolutionDir="${{ github.workspace }}\Project Files\Source\" /m /v:m /nologo

      - name: Build portaudio (native)
        shell: pwsh
        run: msbuild "Project Files\lib\portaudio-19.7.0\build\msvc\portaudio.vcxproj" /p:Configuration=Release /p:Platform=${{ env.native_platform }} /p:SolutionDir="${{ github.workspace }}\Project Files\Source\" /m /v:m /nologo

      - name: Build wdsp (native)
        shell: pwsh
        run: msbuild "Project Files\Source\wdsp\wdsp.vcxproj" /p:Configuration=Release /p:Platform=${{ env.native_platform }} /p:SolutionDir="${{ github.workspace }}\Project Files\Source\" /m /v:m /nologo

      - name: Build ChannelMaster (native)
        shell: pwsh
        run: msbuild "Project Files\Source\ChannelMaster\ChannelMaster.vcxproj" /p:Configuration=Release /p:Platform=${{ env.native_platform }} /p:SolutionDir="${{ github.workspace }}\Project Files\Source\" /m /v:m /nologo

      - name: Build Thetis
        shell: pwsh
        run: msbuild "Project Files\Source\Console\Thetis.csproj" /p:Configuration=Release /p:Platform=${{ env.thetis_platform }} /p:SolutionDir="${{ github.workspace }}\Project Files\Source\" /m /v:m /nologo

      - name: Build MSI installer
        shell: pwsh
        run: msbuild "Project Files\Source\Thetis-Installer\Thetis-Installer.wixproj" /p:Configuration=Release /p:Platform=${{ env.thetis_platform }} /p:SolutionDir="${{ github.workspace }}\Project Files\Source\" /m /v:m /nologo

      - name: Rename MSI with version and arch
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Project Files\bin\Installers\Thetis.msi" -ErrorAction SilentlyContinue
          if (-not $msi) { $msi = Get-ChildItem "Project Files\bin\Installers\*.msi" | Select-Object -First 1 }
          if ($msi) {
            $target = "Thetis_v${{ env.THETIS_VERSION }}-zhcn_${{ env.arch }}.msi"
            Rename-Item $msi.FullName -NewName $target
            Write-Host "MSI -> $target"
          } else {
            Write-Error "No MSI produced"
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $src = "Project Files\bin\${{ env.arch }}\Release"
          $zip = "Thetis_v${{ env.THETIS_VERSION }}-zhcn_${{ env.arch }}.zip"
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thetis-zhcn-${{ env.arch }}
          path: |
            Thetis_v${{ env.THETIS_VERSION }}-zhcn_${{ env.arch }}.zip
            Project Files\bin\Installers\*.msi
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Thetis ${{ env.THETIS_VERSION }} 中文版 (zh-CN)"
          draft: false
          prerelease: false
          files: artifacts/**
          generate_release_notes: true
